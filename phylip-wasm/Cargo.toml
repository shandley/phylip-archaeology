[package]
name = "phylip-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly wrapper for phylip-rs phylogenetic algorithms"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phylip-rs = { path = "../phylip-rs" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
