[project]
name = "phylip-benchmarks"
version = "0.1.0"
description = "Benchmarking phylip-rs against modern phylogenetics tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "seaborn>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
